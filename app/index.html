<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Jobops</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <a class="brand" href="#overview"><span class="mark" aria-hidden="true"></span><span>Jobops</span></a>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <div class="seg" role="group" aria-label="Theme" id="themeSeg"></div>
      <div class="seg" role="group" aria-label="Language" id="langSeg"></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="meta"></p>
        <h1 id="title"></h1>
      </div>
      <div class="actions" id="actions"></div>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer id="foot"></footer>
  </div>
</div>

<dialog id="editor" aria-labelledby="editTitle">
  <form id="editForm" method="dialog">
    <h2 id="editTitle"></h2>
    <p class="sub" id="editSub"></p>
    <div class="grid">
      <label>Company<input name="company" required></label>
      <label>Role<input name="role"></label>
      <label>Source<input name="source" placeholder="linkedin, job-board, email"></label>
      <label>Score (1 to 5)<input name="score" type="number" step="0.1" min="0" max="5"></label>
      <label>Status<select name="status"></select></label>
      <label>Outcome<select name="outcome"></select></label>
      <label>Found<input name="date_found" type="date"></label>
      <label>Applied<input name="date_applied" type="date"></label>
      <label>Outcome date<input name="date_outcome" type="date"></label>
      <label>Gate result<input name="gate_result" placeholder="pass, fail:geo, fail:lang"></label>
    </div>
    <fieldset>
      <legend id="fitLegend"></legend>
      <div class="grid five">
        <label>Domain<input name="domain" type="number" min="1" max="5" step="1"></label>
        <label>Skills<input name="skill" type="number" min="1" max="5" step="1"></label>
        <label>Level<input name="level" type="number" min="1" max="5" step="1"></label>
        <label>Evidence<input name="evidence" type="number" min="1" max="5" step="1"></label>
        <label>Terms<input name="terms" type="number" min="1" max="5" step="1"></label>
      </div>
    </fieldset>
    <label class="wide">Notes<textarea name="notes" rows="3"></textarea></label>
    <div class="row-actions">
      <button class="btn ghost" value="cancel" formnovalidate id="editCancel"></button>
      <button class="btn" value="save" id="editSave"></button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>
<input type="file" id="file" accept=".csv,text/csv" hidden>
<script src="sample-data.js"></script>
<script src="app.js"></script>
</body>
</html>
